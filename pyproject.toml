[project]
name = "holdfast"
version = "0.1.0"
description = "Stateful, compaction-proof constraint guard for coding agents (Claude Code hooks)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
holdfast = "holdfast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["holdfast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
